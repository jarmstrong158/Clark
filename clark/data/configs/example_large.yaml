tasks:
  enabled:
    - pick
    - pack
    - restock
    - side_project
    - management
    - cycle_count
    - receiving
    - idle
  custom: []

volume:
  # Adjust these to your real order volumes.
  seasonal_ranges:
    january:   [400, 700]
    february:  [400, 700]
    march:     [800, 1400]
    april:     [1500, 2500]
    may:       [1800, 3000]
    june:      [1800, 3000]
    july:      [1400, 2200]
    august:    [1400, 2200]
    september: [1200, 1800]
    october:   [1000, 1600]
    november:  [800, 1200]
    december:  [400, 700]
  weekly_curve:
    monday:    [0.86, 1.00]
    tuesday:   [0.71, 0.85]
    wednesday: [0.56, 0.70]
    thursday:  [0.41, 0.55]
    friday:    [0.00, 0.40]

business_rules:
  management_daily_hours_required: 6.0   # larger team = more admin
  management_min_daily_hours: 2.0
  management_backlog_week_threshold: 15.0
  ot_wall_clock_max: 1.5                 # larger team can push longer
  ot_hard_stop_hour: 19.0
  ot_trigger_orders_remaining: 50
  cycle_count_weekly_hours: 3.0
  cycle_count_max_overdue_weeks: 4
  min_staffing_floor: 5                  # always need 5 on production tasks
  high_volume_day_orders: 2000
  high_volume_percentile: 0.75
  target_daily_orders: null
  order_incomplete_threshold: 0
  max_call_offs_per_day: 3              # larger team can absorb more
  max_call_offs_high_volume: 2
  # Shift timing
  day_start_hour: 7.0
  eod_hour: 16.5
  order_cutoff_hour: 16.0
  carrier_pickup_hour: 15.0             # hard carrier deadline at 3 PM
  # Breaks
  lunch_hour: 11.5
  lunch_duration: 0.5
  # Morning pick round
  morning_pick_enabled: true
  morning_pick_carts_min: 2
  morning_pick_carts_max: 4
  morning_pick_per_cart_min: 3
  morning_pick_per_cart_max: 10
  # Equipment
  pack_stations: 12
  carts_available: 40

order_complexity:
  tiers:
    - name: simple
      weight: 0.30
      oph_multiplier: 1.40
    - name: standard
      weight: 0.55
      oph_multiplier: 1.00
    - name: complex
      weight: 0.15
      oph_multiplier: 0.55

rewards: {}
