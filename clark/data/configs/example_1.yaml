# Example Facility 1 — Clark facility config
# Full-featured example: 7 workers, all standard tasks, seasonal volume curve.
# Demonstrates use of debuffs, hustle caps, fixed picker schedule, and cycle counts.
# Copy and adjust to match your real facility.

facility:
  name: "Example Facility 1"
  timezone: "America/New_York"

workers:
  - id: 0
    name: "Manager"
    base_oph: 17.0
    shift_hours: 9.75
    shift_start: 9.0
    role: manager
    task_eligibility: all
    call_off_probability: 0.01
    max_ot_hours: 1.0
    hustle_daily_cap: 9.5
    bad_headspace_effects:
      default: 0.95
    individual_debuff:
      type: family_needs
      probability: 0.25
      cooldown_days: 5
      effect: lose_hours
      hours_lost_range: [1.0, 2.0]
    task_oph_overrides:
      pick: 42.5

  - id: 1
    name: "Asst Manager"
    base_oph: 15.35
    shift_hours: 8.5
    shift_start: 9.0
    role: assistant_manager
    task_eligibility: all
    call_off_probability: 0.02
    max_ot_hours: 1.0
    hustle_daily_cap: 7.0
    bad_headspace_effects:
      side_project: 1.10
      default: 0.90
    individual_debuff:
      type: family_needs
      probability: 0.25
      cooldown_days: 5
      effect: lose_hours
      hours_lost_range: [1.0, 2.0]
    task_oph_overrides:
      pick: 34.5

  - id: 2
    name: "Worker A"
    base_oph: 16.0
    shift_hours: 8.5
    shift_start: 9.0
    role: warehouse
    task_eligibility: all
    call_off_probability: 0.035
    max_ot_hours: 1.0
    hustle_daily_cap: 6.0
    bad_headspace_effects:
      pack: 1.10
      default: 0.90
    individual_debuff:
      type: stomach_issues
      probability: 0.20
      cooldown_days: 4
      effect: oph_penalty
      oph_multiplier: 0.85

  - id: 3
    name: "Worker B"
    base_oph: 18.0
    shift_hours: 8.5
    shift_start: 9.0
    role: warehouse
    task_eligibility: all
    call_off_probability: 0.035
    max_ot_hours: 1.0
    hustle_daily_cap: 8.0
    bad_headspace_effects:
      pack: 1.10
      default: 0.90
    individual_debuff:
      type: eoe_muscle_flare
      probability: 0.0
      cooldown_days: 0
      effect: pack_only
      season_weights:
        winter: 0.05
        spring: 0.20
        summer: 0.25
        fall: 0.12
    task_oph_overrides:
      pick: 45.0

  - id: 4
    name: "Worker C"
    base_oph: 18.5
    shift_hours: 8.5
    shift_start: 9.0
    role: warehouse
    task_eligibility: all
    call_off_probability: 0.035
    max_ot_hours: 1.0
    hustle_daily_cap: 8.0
    bad_headspace_effects:
      default: 1.00
    task_oph_overrides:
      pick: 46.0

  - id: 5
    name: "Worker D"
    base_oph: 15.0
    shift_hours: 8.5
    shift_start: 9.0
    role: warehouse
    task_eligibility: all
    call_off_probability: 0.035
    max_ot_hours: 1.0
    hustle_daily_cap: 3.0
    bad_headspace_effects:
      pack: 1.10
      default: 0.90
    individual_debuff:
      type: soreness
      probability: 0.16667
      cooldown_days: 0
      effect: soreness

  - id: 6
    name: "Worker E"
    base_oph: 15.0
    shift_hours: 8.5
    shift_start: 9.0
    role: warehouse
    task_eligibility: all
    call_off_probability: 0.035
    max_ot_hours: 1.0
    hustle_daily_cap: 7.0
    bad_headspace_effects:
      pack: 1.10
      default: 0.90
    individual_debuff:
      type: family_needs
      probability: 0.15
      cooldown_days: 7
      effect: lose_hours
      hours_lost_range: [1.0, 2.0]

tasks:
  enabled:
    - pick
    - pack
    - restock
    - side_project
    - management
    - idle
    - cycle_count
  custom: []

volume:
  # Example seasonal ranges — replace with your real order volumes
  seasonal_ranges:
    january:   [50, 90]
    february:  [50, 90]
    march:     [120, 220]
    april:     [250, 400]
    may:       [300, 450]
    june:      [300, 450]
    july:      [240, 360]
    august:    [240, 360]
    september: [200, 300]
    october:   [160, 260]
    november:  [120, 200]
    december:  [50, 90]
  weekly_curve:
    monday:    [0.86, 1.00]
    tuesday:   [0.71, 0.85]
    wednesday: [0.56, 0.70]
    thursday:  [0.41, 0.55]
    friday:    [0.00, 0.40]

business_rules:
  management_daily_hours_required: 4.0
  management_min_daily_hours: 1.5
  management_backlog_week_threshold: 10.0
  management_backlog_weekly_penalty: -50.0
  ot_wall_clock_max: 1.0
  ot_hard_stop_hour: 18.5
  ot_trigger_orders_remaining: 10
  cycle_count_weekly_hours: 3.0
  cycle_count_max_overdue_weeks: 4
  min_staffing_floor: 2
  high_volume_day_orders: 380
  high_volume_percentile: 0.75
  target_daily_orders: null
  order_incomplete_threshold: 0
  max_call_offs_per_day: 2
  max_call_offs_high_volume: 1
  # Shift timing
  day_start_hour: 9.0
  eod_hour: 17.5
  order_cutoff_hour: 17.0
  carrier_pickup_hour: null
  # Breaks
  lunch_hour: 13.0
  lunch_duration: 0.5
  # Morning pick round
  morning_pick_enabled: true
  morning_pick_carts_min: 1
  morning_pick_carts_max: 2
  morning_pick_per_cart_min: 1
  morning_pick_per_cart_max: 6
  # Equipment
  pack_stations: null
  carts_available: null
  # Order carryover
  order_carryover_enabled: false
  order_carryover_max_days: 3
  order_carryover_max_backlog: 0
  # Picker assignment
  picker_assignment: round_robin
  fixed_picker_id: null
  # Weekend operations
  work_saturday: false
  saturday_volume_fraction: 0.4
  # Late order exceptions
  late_order_exception_rate: 0.0
  # Inbound freight timing
  restock_availability_hour: 0.0

breaks:
  - hour: 10.0
    duration: 0.25
    staggered: false
  - hour: 13.0
    duration: 0.5
    staggered: false
  - hour: 15.0
    duration: 0.25
    staggered: false

peak_staffing: null

order_complexity:
  tiers:
    - name: standard
      weight: 1.0
      oph_multiplier: 1.0

rewards: {}
