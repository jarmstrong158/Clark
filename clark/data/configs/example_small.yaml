# Small facility example — 5 workers, minimal task set
# Good starting point for a small shipping operation or boutique warehouse.
# Copy this file and adjust to your facility's real numbers.

facility:
  name: "Example Small Facility"
  timezone: "America/Chicago"

workers:
  - id: 0
    name: "Manager"
    base_oph: 16.0
    shift_hours: 9.0
    shift_start: 8.0
    role: manager
    task_eligibility: all
    call_off_probability: 0.01
    hustle_daily_cap: 8.0
    individual_debuff:
      type: family_needs
      probability: 0.20
      cooldown_days: 5
      effect: lose_hours
      hours_lost_range: [0.5, 1.5]

  - id: 1
    name: "Lead"
    base_oph: 17.5
    shift_hours: 8.0
    shift_start: 8.0
    role: lead
    task_eligibility: all
    call_off_probability: 0.025
    hustle_daily_cap: 7.0

  - id: 2
    name: "Worker A"
    base_oph: 15.0
    shift_hours: 8.0
    shift_start: 8.0
    role: warehouse
    task_eligibility: [pick, pack, restock, side_project, idle]
    call_off_probability: 0.035
    hustle_daily_cap: 6.0

  - id: 3
    name: "Worker B"
    base_oph: 14.0
    shift_hours: 8.0
    shift_start: 8.0
    role: warehouse
    task_eligibility: [pick, pack, restock, idle]
    call_off_probability: 0.035
    hustle_daily_cap: 5.0

  - id: 4
    name: "Worker C"
    base_oph: 13.5
    shift_hours: 8.0
    shift_start: 8.0
    role: warehouse
    task_eligibility: [pack, idle]  # pack-only (physical restriction example)
    call_off_probability: 0.04
    hustle_daily_cap: 4.0

tasks:
  enabled:
    - pick
    - pack
    - restock
    - side_project
    - management
    - idle
  custom: []
  # Per-task daily-hours caps (optional). Once the total hours spent on a
  # task (summed across all workers) reach the target, the task is turned
  # off for the rest of the day so no further labor is wasted on it.
  # Management is NOT listed here — it uses business_rules.
  # management_daily_hours_required for its own cap.
  daily_hours:
    side_project: 2.0      # do up to 2 worker-hours of side_project, then stop
  # Grade penalty if a daily_hours target was NOT met by end of day.
  #   none        — cap only, no grade impact (default if omitted)
  #   letter      — drop one grade letter
  #   two_letters — drop two grade letters
  #   fail        — force the day to F
  unmet_penalty:
    side_project: none     # purely a labor cap here; under-doing it doesn't hurt the grade

volume:
  # Adjust these to your real order volumes.
  seasonal_ranges:
    january:   [20, 40]
    february:  [20, 40]
    march:     [40, 80]
    april:     [80, 140]
    may:       [100, 160]
    june:      [100, 160]
    july:      [80, 130]
    august:    [80, 130]
    september: [70, 110]
    october:   [60, 90]
    november:  [40, 70]
    december:  [20, 40]
  weekly_curve:
    monday:    [0.80, 1.00]
    tuesday:   [0.65, 0.85]
    wednesday: [0.50, 0.70]
    thursday:  [0.35, 0.55]
    friday:    [0.00, 0.40]

business_rules:
  management_daily_hours_required: 3.0   # smaller team, less admin overhead
  management_min_daily_hours: 1.0
  ot_wall_clock_max: 1.0
  ot_hard_stop_hour: 18.0
  ot_trigger_orders_remaining: 5
  cycle_count_weekly_hours: 2.0          # 2 workers, 1 hour each
  cycle_count_max_overdue_weeks: 4
  min_staffing_floor: 2
  high_volume_day_orders: 130
  high_volume_percentile: 0.75
  max_call_offs_per_day: 1              # can't afford 2 call-offs on a small team
  # Shift timing
  day_start_hour: 8.0
  eod_hour: 17.0
  order_cutoff_hour: 16.5
  carrier_pickup_hour: null
  # Breaks
  lunch_hour: 12.0
  lunch_duration: 0.5
  # Morning pick round
  morning_pick_enabled: true
  morning_pick_carts_min: 1
  morning_pick_carts_max: 2
  morning_pick_per_cart_min: 1
  morning_pick_per_cart_max: 4
  # Equipment
  pack_stations: null
  carts_available: null
  # Order carryover
  order_carryover_enabled: false
  order_carryover_max_days: 3
  order_carryover_max_backlog: 0
  # Picker assignment
  picker_assignment: round_robin
  fixed_picker_id: null
  # Weekend operations
  work_saturday: false
  saturday_volume_fraction: 0.4
  # Late order exceptions
  late_order_exception_rate: 0.0
  # Inbound freight timing
  restock_availability_hour: 0.0

breaks:
  - hour: 10.0
    duration: 0.25
    staggered: false
  - hour: 12.0
    duration: 0.5
    staggered: false

peak_staffing: null

order_complexity:
  tiers:
    - name: standard
      weight: 1.0
      oph_multiplier: 1.0

rewards: {}
