name: CI

# Passing tests must not depend on local discipline. This runs the full
# suite on every push/PR so a contract drift like the select_action_from_dict
# 5-tuple-vs-4-unpack bug (which shipped to master because nothing enforced
# the tests) fails in CI instead of in someone's `clark plan`.

# Keep this gate in sync with the default branch. It used to read `master`,
# which was correct until the default branch was renamed to `main` — at which
# point the workflow simply stopped triggering, with no error anywhere. Last
# run was 2026-06-07 (on `master`); every commit after the rename landed with
# no CI at all. A rename silently disabling CI is the same "green light that
# checks nothing" the comment above warns about.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU torch, editable)
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the CI image small and fast; the suite
          # does not require CUDA.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest
