[project]
name = "clark"
version = "0.1.0"
description = "Clark — Foundation model for warehouse workforce optimization"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
clark = "cli.main:app"

[tool.setuptools.packages.find]
include = ["clark*", "cli*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
