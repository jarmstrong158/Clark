[project]
name = "clark"
version = "0.1.0"
description = "Clark — Foundation model for warehouse workforce optimization"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
# The test suite needs pytest, which is NOT a runtime dependency. CI
# (and any clean checkout) installs it via `pip install -e ".[dev]"`.
# Previously pytest was only ever present from ambient local
# environments, so CI died with "pytest: command not found".
# `dev` must pull in EVERY optional dep the suite exercises, or CI goes
# green while quietly skipping whole subsystems. It previously carried
# only pytest+httpx, so the serve/API layer and the CP-SAT optimizer
# tests were silently `importorskip`ped in CI — ~27 tests that nothing
# ever ran. The self-references keep one source of truth: adding a dep
# to `serve`/`optimizer` automatically arms it in CI.
dev = ["clark[serve,optimizer]", "pytest>=8", "httpx>=0.27"]
# Minimal local inference API (clark serve). Localhost-only. Drives
# the ops dashboard, the MCP server, and any other consumer. NOT the
# scrapped cloud skeleton — see NOTE.md and dec-029. Optional: core
# training needs none of this.
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
# CP-SAT completion bound (clark/inference/optimizer.py, ENGINEERING
# NOTES §10). `plan_day` imports ortools at call time; it was never
# declared anywhere, so reproducing the bound failed on a clean
# install with a bare ImportError.
optimizer = ["ortools>=9.8"]
# MCP server (`clark mcp`) — lets Claude Desktop / Cursor / Continue /
# Zed drive Clark in natural language using their own model. Pulls in
# the official `mcp` SDK. Optional: not needed if you only use the
# wizard, ops dashboard, or CLI directly.
mcp = ["mcp>=1.2", "httpx>=0.27"]

[project.scripts]
clark = "cli.main:app"

[tool.setuptools.packages.find]
include = ["clark*", "cli*"]

# Non-.py assets must ship in the wheel. Without this, `pip install`
# (non-editable) silently omits facility configs, the wizard UI, and
# the dashboard — every external review's "packaging gap" finding.
# Editable installs masked it because they point at the source tree.
[tool.setuptools.package-data]
clark = [
    "config/*.yaml",
    "data/configs/*.yaml",
    "wizard/*.json",
    "wizard/*.html",
    "wizard/*.bat",
    "dashboard/*.html",
    "dashboard/*.bat",
    "dashboard/*.png",
    "ops/*.html",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
